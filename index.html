<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dev Groovyrey</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #050507;
      --text: #f4f4f5;
      --muted: #a1a1aa;
      --accent: #6366f1;
      --accent2: #a855f7;
    }

    html {
      scroll-behavior: smooth;
      overflow-x: clip;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: clip;
      position: relative;
    }

    .glow {
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.35;
      pointer-events: none;
      z-index: 0;
    }
    .glow-1 {
      width: 480px; height: 480px;
      background: radial-gradient(circle, var(--accent), transparent 70%);
      top: -160px; left: -120px;
      animation: drift 18s ease-in-out infinite alternate;
    }
    .glow-2 {
      width: 420px; height: 420px;
      background: radial-gradient(circle, var(--accent2), transparent 70%);
      bottom: -140px; right: -100px;
      animation: drift 22s ease-in-out infinite alternate-reverse;
    }
    @keyframes drift {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(60px, 40px) scale(1.15); }
    }

    /* TOP LIGHT */
    .glow-top {
      position: fixed;
      top: -240px;
      left: 50%;
      transform: translateX(-50%);
      width: min(920px, 140vw);
      height: 440px;
      background: radial-gradient(ellipse at center,
        rgba(99, 102, 241, 0.55),
        rgba(168, 85, 247, 0.22) 45%,
        transparent 72%);
      filter: blur(70px);
      opacity: 0.55;
      pointer-events: none;
      z-index: 0;
    }
    .top-beam {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg,
        transparent 5%,
        rgba(99, 102, 241, 0.7) 35%,
        rgba(168, 85, 247, 0.9) 50%,
        rgba(99, 102, 241, 0.7) 65%,
        transparent 95%);
      pointer-events: none;
      z-index: 3;
    }

    .grid-overlay {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 56px 56px;
      mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
      -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
      pointer-events: none;
      z-index: 1;
    }

    .content {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 48px 24px;
      animation: rise 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    h1 {
      font-size: clamp(40px, 8vw, 76px);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.05;
      margin-bottom: 32px;
      background: linear-gradient(110deg, var(--accent2), var(--text) 35%, var(--accent) 70%, var(--accent2));
      background-size: 200% auto;
      background-position: 0% center;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shimmer 7s linear infinite, breathe 4.5s ease-in-out infinite alternate;
    }
    @keyframes shimmer {
      from { background-position: 0% center; }
      to   { background-position: 200% center; }
    }
    @keyframes breathe {
      from { filter: drop-shadow(0 0 14px rgba(99, 102, 241, 0.2)); }
      to   { filter: drop-shadow(0 0 30px rgba(168, 85, 247, 0.45)); }
    }

    a.email {
      display: inline-block;
      padding: 14px 32px;
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      text-decoration: none;
      border-radius: 999px;
      background: rgba(99, 102, 241, 0.12);
      border: 1px solid rgba(99, 102, 241, 0.35);
      backdrop-filter: blur(8px);
      transition: all 0.25s ease;
    }
    a.email:hover {
      background: rgba(99, 102, 241, 0.28);
      border-color: rgba(139, 92, 246, 0.6);
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(99, 102, 241, 0.35);
    }
    a.email:active { transform: translateY(0); }

    /* HEADER CARD */
    .container {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 28px;
      padding: 44px 32px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
    }

    /* SOCIALS */
    .socials {
      margin-top: 28px;
      display: flex;
      justify-content: center;
      gap: 12px;
    }
    .social {
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      cursor: default;
      transition: all 0.25s ease;
    }
    .social svg {
      width: 19px;
      height: 19px;
      fill: var(--muted);
      transition: fill 0.25s ease;
    }
    .social:hover {
      background: rgba(255, 255, 255, 0.07);
      border-color: rgba(255, 255, 255, 0.16);
    }
    .social:hover svg { fill: var(--text); }

    .marquee {
      --pad: 24px;
      margin-top: 16px;
      margin-inline: calc(-1 * var(--pad));
      width: calc(100% + 2 * var(--pad));
      max-width: 100vw;
      overflow: hidden;
      padding: 52px 0 12px;
      mask-image: linear-gradient(90deg, transparent, black 12%, black 88%, transparent);
      -webkit-mask-image: linear-gradient(90deg, transparent, black 12%, black 88%, transparent);
    }
    .marquee-track {
      display: flex;
      width: max-content;
      will-change: transform;
      animation: marquee 26s linear infinite;
    }
    .marquee:hover .marquee-track { animation-play-state: paused; }
    @keyframes marquee {
      from { transform: translateX(0); }
      to   { transform: translateX(-50%); }
    }
    .stack {
      display: flex;
      gap: 14px;
      padding-right: 14px;
    }
    .tech {
      position: relative;
      flex-shrink: 0;
      width: 56px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: transform 0.25s ease, background 0.25s ease, border-color 0.25s ease;
    }
    .tech:hover {
      transform: translateY(-4px);
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.18);
    }
    .tech svg { width: 28px; height: 28px; fill: var(--c); transition: filter 0.25s ease; }
    .tech:hover svg { filter: drop-shadow(0 0 10px var(--c)); }
    .tech::after {
      content: attr(data-name);
      position: absolute;
      bottom: calc(100% + 10px);
      left: 50%;
      transform: translateX(-50%) translateY(4px);
      padding: 5px 10px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text);
      background: rgba(24, 24, 27, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: all 0.2s ease;
    }
    .tech:hover::after {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* COMMENTS */
    .comments {
      width: min(560px, calc(100vw - 48px));
      margin-top: 40px;
      text-align: left;
    }
    .comments h2 {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .comments h2::after {
      content: "";
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, rgba(99,102,241,0.4), transparent);
    }
    .comment-form {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      padding: 14px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: border-color 0.25s ease;
    }
    .comment-form:focus-within { border-color: rgba(99, 102, 241, 0.45); }
    .comment-form textarea {
      width: 100%;
      min-height: 64px;
      resize: vertical;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      line-height: 1.55;
    }
    .comment-form textarea::placeholder { color: var(--muted); opacity: 0.7; }
    .comment-form-row {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }
    .comment-form input[type="text"] {
      flex: 1;
      min-width: 0;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 9px 12px;
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      outline: none;
      transition: border-color 0.25s ease;
    }
    .comment-form input[type="text"]::placeholder { color: var(--muted); opacity: 0.7; }
    .comment-form input[type="text"]:focus { border-color: rgba(99, 102, 241, 0.45); }
    .comment-form button {
      padding: 9px 20px;
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      background: rgba(99, 102, 241, 0.25);
      border: 1px solid rgba(99, 102, 241, 0.45);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.25s ease;
      white-space: nowrap;
    }
    .comment-form button:hover:not(:disabled) {
      background: rgba(99, 102, 241, 0.4);
      box-shadow: 0 4px 20px rgba(99, 102, 241, 0.3);
    }
    .comment-form button:disabled { opacity: 0.5; cursor: not-allowed; }
    .hp { position: absolute; left: -9999px; opacity: 0; height: 0; overflow: hidden; }
    .comments-list {
      margin-top: 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .comment {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 14px;
      padding: 12px 16px;
      animation: rise 0.5s ease both;
    }
    .comment-head {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 3px;
    }
    .avatar {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      flex-shrink: 0;
      align-self: center;
    }
    .comment-name { font-size: 13px; font-weight: 600; }
    .comment-time { font-size: 11px; color: var(--muted); opacity: 0.75; }
    .comment-text {
      font-size: 14px;
      color: rgba(244, 244, 245, 0.92);
      word-wrap: break-word;
      overflow-wrap: break-word;
      white-space: pre-wrap;
    }
    .comments-status {
      text-align: center;
      font-size: 12.5px;
      color: var(--muted);
      padding: 14px 0;
    }
    .comments-status.error { color: #f87171; }

    @media (max-width: 640px) {
      .content { padding: 40px 20px; }
      .container { padding: 32px 20px; border-radius: 22px; }
      .marquee { --pad: 20px; padding: 44px 0 8px; }
      .stack { gap: 10px; padding-right: 10px; }
      .tech { width: 46px; height: 46px; border-radius: 13px; }
      .tech svg { width: 24px; height: 24px; }
      .glow { filter: blur(90px); opacity: 0.28; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>

<section class="comments" id="comments">
  <h2>Comments</h2>
  <form class="comment-form" id="comment-form" autocomplete="off">
    <textarea id="comment-text" maxlength="500" placeholder="Say something nice... (anonymous, no account needed)" required></textarea>
    <div class="hp" aria-hidden="true"><input type="text" name="honeypot" tabindex="-1" autocomplete="off"></div>
    <div class="comment-form-row">
      <input type="text" id="comment-name" maxlength="40" placeholder="Name (optional — Anonymous)">
      <button type="submit" id="comment-submit">Post</button>
    </div>
  </form>
  <div class="comments-list" id="comments-list"></div>
  <div class="comments-status" id="comments-status">Loading comments…</div>
</section>

<!-- Cloudflare Web Analytics -->
<script type="module" src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "b2891b9f47904d838b29e2266915c9e8"}'></script>
<!-- End Cloudflare Web Analytics -->

<script>
(() => {
  const API = "https://cf-worker-demo.reymartcenteno03.workers.dev/api/groovyrey/comments";
  const list = document.getElementById("comments-list");
  const status = document.getElementById("comments-status");
  const form = document.getElementById("comment-form");
  const textEl = document.getElementById("comment-text");
  const nameEl = document.getElementById("comment-name");
  const submitBtn = document.getElementById("comment-submit");

  const esc = (s) =>
    String(s).replace(/[&<>"']/g, (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  const fmtTime = (utc) => {
    const d = new Date(String(utc).replace(" ", "T") + "Z");
    if (isNaN(d)) return "";
    const diff = (Date.now() - d.getTime()) / 1000;
    if (diff < 60) return "just now";
    if (diff < 3600) return Math.floor(diff / 60) + "m ago";
    if (diff < 86400) return Math.floor(diff / 3600) + "h ago";
    if (diff < 604800) return Math.floor(diff / 86400) + "d ago";
    return d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
  };

  const render = (comments) => {
    list.innerHTML = comments
      .map((c) => {
        const name = c.name || "Anonymous";
        return `<div class="comment">
          <div class="comment-head">
            <span class="avatar">${esc(name[0].toUpperCase())}</span>
            <span class="comment-name">${esc(name)}</span>
            <span class="comment-time">${fmtTime(c.created_at)}</span>
          </div>
          <div class="comment-text">${esc(c.text)}</div>
        </div>`;
      })
      .join("");
  };

  const load = async () => {
    try {
      const res = await fetch(API);
      if (!res.ok) throw new Error(res.status);
      const data = await res.json();
      render(data.comments || []);
      status.textContent = data.count ? "" : "No comments yet — be the first!";
    } catch {
      list.innerHTML = "";
      status.textContent = "Couldn't load comments.";
      status.classList.add("error");
    }
  };

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = textEl.value.trim();
    if (!text) return;
    submitBtn.disabled = true;
    submitBtn.textContent = "Posting…";
    try {
      const res = await fetch(API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: nameEl.value.trim(), text, honeypot: form.honeypot.value }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || res.status);
      textEl.value = "";
      form.honeypot.value = "";
      await load();
    } catch (err) {
      status.textContent = err.message === "Failed to fetch" ? "Couldn't post right now." : String(err.message);
      status.classList.add("error");
      setTimeout(() => status.classList.remove("error"), 4000);
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Post";
    }
  });

  load();
})();
</script>
