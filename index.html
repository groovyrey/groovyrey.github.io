<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reymart Centeno</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0a0a0a;
      --text: #e5e5e5;
      --muted: #737373;
      --accent: #3b82f6;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .content { text-align: center; padding: 48px 24px; }

    h1 {
      font-size: clamp(32px, 6vw, 56px);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
    }

    a.email {
      display: inline-block;
      margin-top: 8px;
      padding: 12px 28px;
      background: var(--accent);
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      border-radius: 8px;
      transition: background 0.2s;
    }

    a.email:hover { background: #2563eb; }
  </style>
</head>
<body>

<div class="content">
  <h1>Reymart Centeno</h1>
  <a class="email" href="mailto:reymartcenteno03@gmail.com">Email Me!</a>
</div>

</body>
</html>
